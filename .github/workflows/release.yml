name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Build macOS and Linux archives
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release.py --tag "$RELEASE_TAG"
      - name: Verify archives
        run: |
          cd "dist/$(cat VERSION)"
          sha256sum --check SHA256SUMS
          for archive in *.tar.gz; do tar -tzf "$archive"; done
          tar -xzf "hop_$(cat ../../VERSION)_linux_amd64.tar.gz" hop
          test "$(./hop --version)" = "hop $(cat ../../VERSION)"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          awk '/^## / { if (entry) exit; entry=1 } entry { print }' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          if gh release view "$RELEASE_TAG" --json isDraft >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true || {
              echo 'This release is already published; refusing to replace its assets.'
              exit 1
            }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Hop $RELEASE_TAG" --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" dist/"$(cat VERSION)"/*.tar.gz dist/"$(cat VERSION)"/SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --draft=false

name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Install Linux test server
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y openssh-sftp-server python3
      - name: Require integration-test dependencies
        shell: bash
        run: |
          command -v python3
          test -x /usr/libexec/sftp-server || test -x /usr/lib/openssh/sftp-server
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -timeout 120s ./...
      - name: Build and smoke test
        run: |
          make build
          test "$(./hop --version)" = "hop $(cat VERSION)"
          ./hop --help
